# Default parameters for the synthetic lattice tower.
#
# Geometry mirrors LUMO's stated dimensions (9 m, three 3 m segments,
# triangular isosceles cross-section, 7 bracing levels per segment).
# base_width_m / depth_m and the material areas below are first-pass
# placeholders tuned only so the first bending frequency lands in the
# "single-digit to low tens of Hz" range expected for a lattice mast of
# this size (see TowerWatch_guideline.md Sec 4.2 acceptance criteria).
# Revisit against LUMO's actual README/FE model on Day 4.

geometry:
  height_m: 9.0
  n_segments: 3
  segment_height_m: 3.0
  bracing_levels_per_segment: 7
  base_width_m: 1.2   # distance between the two "back" legs
  depth_m: 1.0        # perpendicular distance of the third leg (isosceles apex)

material:
  youngs_modulus_pa: 200.0e+9  # structural steel; PyYAML requires an explicit exponent sign
  density_kg_m3: 7850.0
  leg_area_m2: 5.0e-4
  brace_area_m2: 2.0e-4        # applies to both diagonal and horizontal braces

damage:
  severities: [0.3, 0.5, 0.7, 1.0]

modal:
  n_modes: 20

simulate:
  sampling_rate_hz: 1651.6129032258063   # LUMO's real hardware rate (Stage 4), replaces the Day-1 placeholder of 500
  window_length: 3383          # samples per window, chosen to match the ORIGINAL ~2.05 s window duration at the new rate (not LUMO's shorter 2048-sample/1.24s window): a shorter window gave Welch's method less data to average per window, which measurably weakened the one feature that separates healthy from damaged (see DAY_4.md)
  windows_per_instance: 4      # windows sliced from each simulated instance
  n_instances_per_class: 150   # independent (temperature, noise) draws per damage class
  damping_ratio: 0.01          # modal damping ratio (1%), applied to every retained mode
  excitation_std_n: 50.0       # std dev of the white-noise nodal force per excited DOF [N]
  excitation_cutoff_hz: 60.0   # low-pass cutoff for the band-limited excitation
  measurement_noise_rms_fraction: 0.02   # 2% RMS measurement noise, relative to each channel
  burn_in_seconds: 8.0         # discarded before windowing, lets startup transient decay
  n_sensor_levels: 6           # mirrors LUMO's 6 measurement levels (3 legs x 6 = 18 sensors)

environment:
  temperature_min_c: -10.0
  temperature_max_c: 40.0
  reference_temperature_c: 20.0
  modulus_temp_coefficient_per_c: 0.0003   # E(T) = E0 * (1 - alpha*(T - T0))

features:
  band_edges_hz: [0, 5, 10, 15, 20, 30, 50, 100]

graph:
  n_distance_levels: 2   # connect each sensor to its 2 nearest hop-distance categories

model:
  healthy_test_fraction: 0.25   # fraction of healthy INSTANCES held out for final testing, not windows
  healthy_val_fraction: 0.15    # fraction of healthy INSTANCES held out for early stopping / overfit checks
  random_seed: 0
  hidden_dim: 16
  latent_dim: 8
  learning_rate: 0.005   # lowered from 0.01: the larger Stage 3 dataset needed a smaller step for stable convergence
  max_epochs: 3000              # safety cap; training stops earlier via early stopping below
  early_stopping_patience: 100  # stop once validation loss hasn't improved for this many epochs
  early_stopping_min_delta: 0.0001
  pca_n_components: 10
  isolation_forest_n_estimators: 100
  localization_top_k: 3

lumo:
  # Unzipped exemplary-dataset directory (scripts/05_lumo_transfer.py
  # Sec 7.1: 3 exemplary ZIPs -- DAM3/DAM4/DAM6, "111" severity --
  # downloaded and unzipped here; see DAY_4.md for exact links and
  # sizes). Each ZIP extracts its own Healthy/ and DAM<n>_111/ pair of
  # folders with no name collisions, so all 3 land side by side in one
  # directory; list_blocks() discovers every state subfolder within it.
  data_dirs:
    - data/lumo/exemplary_datasets
  window_length: 2048   # ~1.24s at LUMO's native 1651.6 Hz; processed as its own pipeline, not required to match the synthetic model's window length
  healthy_test_fraction: 0.25   # fraction of healthy 10-minute BLOCKS held out for testing, not windows (see DAY_4.md on why blocks are the splitting unit)
  healthy_val_fraction: 0.15
